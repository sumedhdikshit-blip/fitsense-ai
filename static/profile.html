<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitSense AI — Profile</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .profile-page-card {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: 32px;
      max-width: 640px;
    }
    .profile-page-card h2 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 24px;
      color: var(--text-main);
    }
    .profile-save-row {
      margin-top: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .profile-saved-msg {
      color: var(--accent-color);
      font-size: 0.9rem;
      font-weight: 600;
      display: none;
    }
    /* Neutral gray styles for the experimental section */
    .experimental-card {
      background-color: #1c1c1c;
      border: 1px solid #2d2d2d;
      border-radius: var(--border-radius);
      padding: 32px;
      max-width: 640px;
      margin-top: 24px;
    }
    .experimental-card h3 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #9e9e9e;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .experimental-desc {
      color: #888888;
      font-size: 0.88rem;
      margin-bottom: 20px;
      line-height: 1.45;
    }
    .experimental-disclaimer {
      font-size: 0.82rem;
      color: #a5a5a5;
      background-color: #121212;
      border-left: 3px solid #757575;
      padding: 12px 16px;
      margin-top: 16px;
      line-height: 1.5;
      border-radius: 4px;
    }
    .experimental-result {
      background-color: #151515;
      border: 1px solid #282828;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
      display: none;
    }
    .result-value-box {
      font-size: 1.6rem;
      font-weight: 800;
      color: #e0e0e0;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .result-badge {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 3px 8px;
      border-radius: 4px;
      background-color: #333333;
      color: #bdbdbd;
    }
    .error-box {
      background-color: rgba(239, 83, 80, 0.05);
      border: 1px solid rgba(239, 83, 80, 0.2);
      color: #ef5350;
      padding: 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      margin-top: 16px;
      display: none;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Nav injected here -->
    <div id="navPlaceholder"></div>

    <div class="profile-page-card">
      <h2>Profile Settings</h2>

      <div class="form-group">
        <label for="profileName">Name</label>
        <input type="text" id="profileName" placeholder="Athlete" class="form-input">
      </div>
      <div class="form-row">
        <div class="form-group col-6">
          <label for="profileAge">Age (Years)</label>
          <input type="number" id="profileAge" min="1" max="120" class="form-input">
        </div>
        <div class="form-group col-6">
          <label for="profileSex">Biological Sex</label>
          <select id="profileSex" class="form-select">
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="unspecified">Unspecified / Other</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group col-6">
          <label for="profileWeight">Weight (kg)</label>
          <input type="number" id="profileWeight" step="0.1" min="10" max="500" class="form-input">
        </div>
        <div class="form-group col-6">
          <label for="profileHeight">Height (cm)</label>
          <input type="number" id="profileHeight" step="0.5" min="50" max="300" class="form-input">
        </div>
      </div>
      <div class="form-group">
        <label for="profileGoal">Fitness Goal</label>
        <input type="text" id="profileGoal" placeholder="e.g. Fat loss, build muscle" class="form-input">
      </div>

      <!-- Additional health profile details for prediction fallback -->
      <h3 style="font-size: 1rem; font-weight: 700; margin: 24px 0 16px; color: var(--accent-color);">Health Parameters (Exploratory)</h3>

      <div class="form-row">
        <div class="form-group col-6">
          <label for="profileGender">Gender Identity</label>
          <select id="profileGender" class="form-select">
            <option value="">-- Select --</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group col-6">
          <label for="profileSmoker">Are you a Smoker?</label>
          <select id="profileSmoker" class="form-select">
            <option value="">-- Select --</option>
            <option value="no">No</option>
            <option value="yes">Yes</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group col-6">
          <label for="profileSleep">Average Sleep (Hours)</label>
          <input type="number" id="profileSleep" step="0.1" min="0" max="24" placeholder="e.g. 7.5" class="form-input">
        </div>
        <div class="form-group col-6">
          <label for="profileStress">Stress Level (1-10)</label>
          <input type="number" id="profileStress" min="1" max="10" placeholder="e.g. 5" class="form-input">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group col-6">
          <label for="profileExerciseFreq">Exercise Frequency</label>
          <select id="profileExerciseFreq" class="form-select">
            <option value="">-- Select --</option>
            <option value="none">None</option>
            <option value="1-2 times/week">1-2 times/week</option>
            <option value="3-5 times/week">3-5 times/week</option>
            <option value="daily">Daily</option>
          </select>
        </div>
        <div class="form-group col-6">
          <label for="profileDietQuality">Diet Quality</label>
          <select id="profileDietQuality" class="form-select">
            <option value="">-- Select --</option>
            <option value="poor">Poor</option>
            <option value="average">Average</option>
            <option value="good">Good</option>
            <option value="excellent">Excellent</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="profileAlcohol">Alcohol Consumption</label>
        <select id="profileAlcohol" class="form-select">
          <option value="">-- Select --</option>
          <option value="none">None</option>
          <option value="low">Low</option>
          <option value="moderate">Moderate</option>
          <option value="high">High</option>
        </select>
      </div>

      <div class="profile-save-row">
        <button id="saveProfileBtn" class="btn btn-success">Save Profile Settings</button>
        <span class="profile-saved-msg" id="profileSavedMsg">✓ Saved!</span>
      </div>
    </div>

    <!-- Experimental Section Card (visually and contextually separate) -->
    <div class="experimental-card">
      <h3>
        <svg style="width:20px;height:20px;color:#9e9e9e;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
        </svg>
        Experimental: Chronic Disease Risk Model (Not Medical Advice)
      </h3>
      <p class="experimental-desc">
        Calculate your exploratory chronic disease probability based on the ensemble classifier trained on synthetic lifestyle data.
      </p>

      <button id="estimateRiskBtn" class="btn btn-secondary" style="width: 100%; justify-content: center; padding: 12px; font-weight: 600;">
        📊 Calculate Exploratory Estimate
      </button>

      <!-- Missing parameters warning box -->
      <div id="riskErrorBox" class="error-box"></div>

      <!-- Risk score result (prominently includes risk probability AND the confidence disclaimer) -->
      <div id="riskResultBox" class="experimental-result">
        <div class="result-value-box">
          <span>Risk Probability: <strong id="riskProbabilityVal">--%</strong></span>
          <span class="result-badge" id="riskClassBadge">Low Risk</span>
        </div>
        <div class="experimental-disclaimer" id="riskConfidenceDisclaimer">
          <!-- Confidence disclaimer text injected dynamically here -->
        </div>
      </div>
    </div>
  </div>

  <script src="app-shared.js"></script>
  <script src="profile.js"></script>
</body>
</html>
